# Enable the headers module
LoadModule headers_module modules/mod_headers.so

# Allow requests from your origin
Header set Access-Control-Allow-Origin "http://localhost:8100"
Header set Access-Control-Allow-Methods "GET, POST, OPTIONS, DELETE, PUT"
Header set Access-Control-Allow-Headers "Content-Type, Authorization"

# Dev server only: never let a browser cache the source modules. The widget is split across several files
# (main, vectorseek, voice, conversation, ...); a stale cached copy of one mixed with a fresh copy of another
# breaks in confusing ways, and Safari / Brave cache aggressively when no Cache-Control header is sent.
Header set Cache-Control "no-store"
